location = /intranet/nhl-dashboard {
    return 301 /intranet/nhl-dashboard/;
}

# Keep configuration endpoints on private networks even if the dashboard is
# later exposed through a public reverse proxy.
location ~ ^/intranet/nhl-dashboard/settings(?:/|$) {
    allow 127.0.0.1;
    allow ::1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /intranet/nhl-dashboard;
    rewrite ^/intranet/nhl-dashboard/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:5055;
}

location /intranet/nhl-dashboard/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /intranet/nhl-dashboard;
    proxy_pass http://127.0.0.1:5055/;
}
