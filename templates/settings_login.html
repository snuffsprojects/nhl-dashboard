<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin login · NHL Dashboard</title><link rel="stylesheet" href="{{ url_for('static',filename='settings.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">{{ dashboard.teamMark }}</span><span><strong>{{ dashboard.siteName }}</strong><small>Settings</small></span></a><a class="back" href="{{ url_for('index') }}">Back to games</a></header>
<main class="narrow"><p class="eyebrow">Local administration</p><h1>Settings login.</h1><p class="lede">Sign in with the password created on this server.</p><section class="panel">{% if error %}<p class="message error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Admin password<input type="password" name="password" autocomplete="current-password" autofocus required></label><div class="actions"><span></span><button class="button" type="submit">Sign in</button></div></form></section></main></body></html>
