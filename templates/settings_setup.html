<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set up NHL Dashboard</title><link rel="stylesheet" href="{{ url_for('static',filename='settings.css') }}"></head><body>
<header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">N</span><span><strong>NHL Dashboard</strong><small>Local setup</small></span></a><a class="back" href="{{ dashboard.backUrl }}">{{ dashboard.backLabel }}</a></header>
<main class="narrow"><p class="eyebrow">First run</p><h1>Claim your dashboard.</h1><p class="lede">Create the local administrator password used to change teams and dashboard settings. It never leaves this server.</p>
<section class="panel">{% if error %}<p class="message error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="grid"><label class="wide">Admin password<input type="password" name="password" minlength="10" autocomplete="new-password" required></label><label class="wide">Confirm password<input type="password" name="confirm_password" minlength="10" autocomplete="new-password" required></label></div><div class="actions"><span class="hint">At least 10 characters.</span><button class="button" type="submit">Create administrator</button></div></form></section></main></body></html>
